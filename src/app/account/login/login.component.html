<section class="auth-page-wrapper py-5 position-relative d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row  justify-content-center  shadow-p-2">
      <div class="col-lg-11 ">
        <div class="card mb-0">
          <div class="row g-0 align-items-center box">
            <!-- <div class="col-lg-6 bg-danger ">
             <div class="bg-danger">
              <div class=" auth-card  h-100 border-0 shadow-none d-sm-block mb-0  ">
                <img
                  src="../../../assets/images/bg/vecteezy_digital-data-protection-design-illustration-cyber-security_23258496_423.png"
                  alt="" class="img-fluid img">
              </div>
             </div>
            </div> -->
            <div class="col-lg-5 mx-auto ">
              <div class=" mb-0 border-0 shadow-none mb-0">
                <div class="">
                  <img
                    src="../../../assets/images/bg/vecteezy_digital-data-protection-design-illustration-cyber-security_23258496_423.png"
                    alt="" class="img-fluid img">
                </div>
              </div>
            </div>
            <div class="col-lg-6 mx-auto">
              <div class=" mb-0 border-0 shadow-none mb-0">
                <div class="card-body p-sm-5 m-lg-4">
                  <div class="text-center img">
                    <img src="assets/images/logo/gigasol logo.png" alt="" height="75">
                  </div>
                  <div class="text-center mt-4">
                    <h5 class="fs-3xl">Welcome</h5>
                    <p class="text-muted">Sign in to continue to Gigatel.</p>
                  </div>
                  <div class="p-2 mt-5">
                    <form [formGroup]="loginForm">

                      <div class="mb-3">
                        <label class="form-label"> UserId<span class="text-danger">*</span></label>
                        <div class="position-relative ">
                          <input type="text" class="form-control  password-input" formControlName="user"
                            [ngClass]="{ 'is-invalid': submitted && f['user'].errors }" placeholder="Enter UserId"
                            required>
                          <div *ngIf="submitted && f['user'].errors" class="invalid-feedback">
                            <div *ngIf="f['user'].errors['required']">UserId is required</div>
                          </div>
                        </div>
                      </div>

                      <div class="mb-3">
                        <label class="form-label" for="password-input">Password <span
                            class="text-danger">*</span></label>
                        <div class="position-relative auth-pass-inputgroup mb-3">
                          <input [type]="fieldTextType ? 'text' : 'password'" formControlName="password"
                            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" type="password"
                            class="form-control pe-5 password-input " placeholder="Enter Password" id="password-input"
                            required>
                          <button
                            class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon"
                            type="button" id="password-addon"><i class="ri-eye-fill align-middle" [ngClass]="{'mdi-eye-off-outline': !fieldTextType, 'mdi-eye-outline': fieldTextType
                                                    }" (click)="toggleFieldTextType()"></i></button>
                          <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                            <span *ngIf="f['password'].errors['required']">Password is required</span>
                          </div>
                        </div>
                      </div>
                      <div class="mt-4">
                        <button class="btn btn-primary w-100" type="submit" (click)="onSubmit()">Sign In</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-loader [loader]="loader"></app-loader>
